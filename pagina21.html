<h2 class="pergunta-titulo">Como funciona o Event Loop do JavaScript e qual é a diferença entre Microtasks e Macrotasks?</h2>
<div class="answers-grid">
<button class="answer-btn btn-vermelho" onclick="responder('errada')"><span class="answer-shape">▲</span>O Event Loop serve apenas para organizar elementos HTML e aplicar estilos CSS.
</button>
<button class="answer-btn btn-azul" onclick="responder('certa')"><span class="answer-shape">◆</span>O Event Loop permite que o JavaScript execute tarefas assíncronas mesmo sendo single-threaded.</button>
<button class="answer-btn btn-amarelo" onclick="responder('errada')"><span class="answer-shape">●</span>O Event Loop impede o JavaScript de executar operações assíncronas.</button>
<button class="answer-btn btn-verde" onclick="responder('errada')"><span class="answer-shape">■</span>O Event Loop permite que o JavaScript execute várias tarefas simultaneamente em diferentes threads.
 </button>
</div>

<script>
function responder(tipo){
if(tipo === 'certa'){
window.location.href = 'pagina22.html';
} else {
var atual = parseInt(localStorage.getItem('erros') || '0');
localStorage.setItem('erros', atual + 1);
window.location.href = 'explicacao21.html';}
