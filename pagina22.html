<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pergunta 1</title>
<link href="style.css" rel="stylesheet">
</head>
<body>
<div class="container-kahoot">
<div class="top-bar">
<span class="badge-pergunta">Pergunta 1 de 5</span>
<span class="badge-pergunta">⏱️ Frontend</span>
</div>
<div class="progress-track">
<div class="progress-fill" style="width:20%;"></div>
</div>
<div class="card-kahoot">
<h2 class="pergunta-titulo">O que é uma função em JavaScript e para que ela serve?</h2>
<div class="answers-grid">
<button class="answer-btn btn-vermelho" onclick="responder('errada')"><span class="answer-shape">▲</span>Uma função em JavaScript é um tipo de variável usada exclusivamente para armazenar números e textos.</button>
<button class="answer-btn btn-azul" onclick="responder('certa')"><span class="answer-shape">◆</span>Uma função é um bloco de código criado para realizar uma determinada tarefa. Ela pode ser executada sempre que necessário, evitando repetir código.</button>
<button class="answer-btn btn-amarelo" onclick="responder('errada')"><span class="answer-shape">●</span>Uma função é responsável por criar automaticamente o design e as cores de uma página HTML.</button>
<button class="answer-btn btn-verde" onclick="responder('errada')"><span class="answer-shape">■</span>Uma função é um comando que serve apenas para conectar o JavaScript ao banco de dados, não podendo ser executada mais de uma vez.</button>
</div>
</div>
</div>
<script>
function responder(tipo){
if(tipo === 'certa'){
window.location.href = 'pagina23.html';
} else {
var atual = parseInt(localStorage.getItem('erros') || '0');
localStorage.setItem('erros', atual + 1);
window.location.href = 'explicacao22.html';
}
}
</script>
</body>
