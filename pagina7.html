<h2 class="pergunta-titulo">Sobre as tags de cabeçalho h1, h2 e h3 em HTML, assinale a alternativa correta:</h2>
<div class="answers-grid">
<button class="answer-btn btn-vermelho" onclick="responder('errada')"><span class="answer-shape">▲</span>serve so para mudar o tamanho do texto sem hierarquia</button>
<button class="answer-btn btn-azul" onclick="responder('errada')"><span class="answer-shape">◆</span>é obrigatorio usa-las em ordem crescentes, começando por h3</button>
<button class="answer-btn btn-amarelo" onclick="responder('certa')"><span class="answer-shape">●</span>h1 é o nivel mais importante; h2 e h3 são subtitulos hierarquicos</button>
