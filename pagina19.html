<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pergunta 19</title>
<link href="style.css" rel="stylesheet">
</head>
<body>
<div class="container-kahoot">
<div class="top-bar">
<span class="badge-pergunta">Pergunta 19</span>
<span class="badge-pergunta">⏱️ Frontend</span>
</div>
<div class="progress-track">
<div class="progress-fill" style="width:100%;"></div>
</div>
<div class="card-kahoot">
<h2 class="pergunta-titulo">No desenvolvimento Front-End, para que serve o localStorage do navegador?</h2>
<div class="answers-grid">
<button class="answer-btn btn-vermelho" onclick="responder('errada')"><span class="answer-shape">▲</span>Executar códigos JavaScript no servidor</button>
<button class="answer-btn btn-azul" onclick="responder('certa')"><span class="answer-shape">◆</span>Armazenar dados no navegador do usuário mesmo após fechar a página</button>
<button class="answer-btn btn-amarelo" onclick="responder('errada')"><span class="answer-shape">●</span>Conectar diretamente o site a um banco de dados</button>
<button class="answer-btn btn-verde" onclick="responder('errada')"><span class="answer-shape">■</span>Hospedar os arquivos HTML do site</button>
</div>
</div>
</div>
<script>
function responder(tipo){
if(tipo === 'certa'){
window.location.href = "pagina20.html";
} else {
var atual = parseInt(localStorage.getItem('erros') || '0');
localStorage.setItem('erros', atual + 1);
window.location.href = 'explicacao19.html';
}
}
</script>
</body>
</html>
