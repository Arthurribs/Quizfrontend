<button class="answer-btn btn-vermelho" onclick="responder('errada')"><span class="answer-shape">▲</span>Centraliza todos os elementos da tag purple</button>
<button class="answer-btn btn-azul" onclick="responder('errada')"><span class="answer-shape">◆</span>Troca a cor das fontes para roxo</button>
<button class="answer-btn btn-amarelo" onclick="responder('certa')"><span class="answer-shape">●</span>Deixa o fundo de todas as páginas em roxo</button>

<script>
function responder(tipo){
if(tipo === 'certa'){
window.location.href = 'pagina12.html';
} else {
var atual = parseInt(localStorage.getItem('erros') || '0');
localStorage.setItem('erros', atual + 1);
window.location.href = 'explicacao11.html';
}
}
