<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pergunta 1</title>
<link href="style.css" rel="stylesheet">
</head>
<body>
<div class="container-kahoot">
<div class="top-bar">
<span class="badge-pergunta">Pergunta 25 de 30</span>
<span class="badge-pergunta">⏱️ Frontend</span>
</div>
<div class="progress-track">
<div class="progress-fill" style="width:20%;"></div>
</div>
<div class="card-kahoot">
<h2 class="pergunta-titulo">Qual é o principal objetivo do CSS em um projeto web?</h2>
<div class="answers-grid">
<button class="answer-btn btn-vermelho" onclick="responder('errada')"><span class="answer-shape">▲</span>Adicionar lógica de programação e interatividade avançada ao navegador</button>
<button class="answer-btn btn-azul" onclick="responder('errada')"><span class="answer-shape">◆</span>Estruturar o conteúdo textual e os dados semânticos da página</button>
<button class="answer-btn btn-amarelo" onclick="responder('certa')"><span class="answer-shape">●</span> Personalizar a aparência visual, cores, fontes e o layout dos elementos HTML</button>
<button class="answer-btn btn-verde" onclick="responder('errada')"><span class="answer-shape">■</span>Gerenciar o banco de dados e as requisições do servidor web</button>
</div>
</div>
</div>
<script>
function responder(tipo){
if(tipo === 'certa'){
window.location.href = 'pagina25.html';
} else {
var atual = parseInt(localStorage.getItem('erros') || '0');
localStorage.setItem('erros', atual + 1);
window.location.href = 'explicacao24.html';
}
}
</script>
</body>
